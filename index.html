<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Cozinha & TV - CASA DE LANCHES XPTO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #121212; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER DE ESCOLHA DE MODO */
        #mode-selector {
            background: #222; padding: 10px; text-align: center; border-bottom: 2px solid #444;
            display: flex; justify-content: center; gap: 15px; align-items: center; z-index: 1000;
        }
        #mode-selector button { padding: 8px 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; }
        .btn-admin { background: #ff9800; color: #000; }
        .btn-tv { background: #4caf50; color: #fff; }
        .btn-menu { background: #00bcd4; color: #000; }

        /* TELAS */
        .screen { display: none; flex: 1; height: calc(100vh - 45px); overflow: hidden; }
        .active { display: flex; }

        /* --- TELA DO CAIXA / COZINHA (ADMIN) --- */
        #admin-screen { padding: 20px; gap: 20px; background: #181818; overflow-y: auto; }
        .admin-column { flex: 1; background: #222; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; min-width: 280px; }
        .admin-column h2 { margin-bottom: 15px; font-size: 1.1rem; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .form-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .form-group input { flex: 1; padding: 12px; font-size: 1rem; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; }
        .form-group button { padding: 0 20px; background: #2196f3; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        .order-list-admin { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; max-height: 400px; }
        .order-card-admin { background: #2a2a2a; padding: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #ff9800; }
        .order-card-admin.ready { border-left-color: #4caf50; }
        .order-card-admin.history { border-left-color: #777; opacity: 0.7; }
        .order-card-admin button { padding: 6px 12px; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .order-card-admin button.cancel { background: #f44336; }

        /* --- TELA DE GERENCIAMENTO DO CARDÁPIO --- */
        #menu-screen { padding: 20px; background: #181818; flex-direction: column; gap: 15px; overflow-y: auto; }
        .menu-form { background: #222; padding: 15px; border-radius: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .menu-form input { padding: 10px; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; flex: 1; min-width: 200px; }
        .menu-form button { padding: 10px 20px; background: #4caf50; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .menu-form button.btn-cancel-edit { background: #777; display: none; }
        
        .menu-items-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; overflow-y: auto; }
        .menu-item-card { background: #2a2a2a; padding: 15px; border-radius: 6px; border-top: 4px solid #00bcd4; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
        .menu-item-actions { display: flex; gap: 8px; }
        .menu-item-actions button { flex: 1; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
        .btn-edit { background: #ff9800; color: #000 !important; }
        .btn-delete { background: #f44336; }

        /* --- TELA DA TV --- */
        #tv-screen { display: grid; grid-template-columns: 60% 40%; height: 100%; background: #000; }
        
        .tv-left { padding: 30px; display: flex; flex-direction: column; background: #111; border-right: 4px solid #333; }
        .tv-left h1 { font-size: 2.2rem; color: #4caf50; margin-bottom: 20px; text-transform: uppercase; text-align: center; letter-spacing: 2px; }
        .grid-prontos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; align-content: start; flex: 1; }
        
        /* Apenas o card pronto pulsa alternando verde e vermelho */
        .card-pronto {
            background: #1b5e20; border: 3px solid #4caf50; border-radius: 12px; padding: 25px;
            text-align: center; animation: alertaCores 1s infinite alternate; box-shadow: 0 0 25px rgba(76, 175, 80, 0.6);
        }
        .card-pronto .nome { font-size: 2.6rem; font-weight: bold; color: #fff; word-break: break-all; }
        .card-pronto .status-txt { font-size: 1.2rem; color: #ffeb3b; margin-top: 10px; text-transform: uppercase; font-weight: bold; }

        @keyframes alertaCores {
            0% { transform: scale(1); background: #1b5e20; border-color: #4caf50; }
            100% { transform: scale(1.03); background: #7f1d1d; border-color: #ef4444; }
        }

        .tv-right { background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; position: relative; overflow: hidden; }
        .carousel-slide { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; }
        .carousel-slide.active-slide { display: flex; }
        
        .menu-display-title { font-size: 2.5rem; color: #ff9800; margin-bottom: 25px; text-transform: uppercase; border-bottom: 2px solid #ff9800; padding-bottom: 10px; width: 100%; }
        .menu-grid-tv { display: grid; grid-template-columns: 1fr; gap: 15px; width: 100%; max-height: 75%; overflow-y: auto; padding: 0 10px; }
        .menu-row-tv { display: flex; justify-content: space-between; background: #252525; padding: 15px 20px; border-radius: 8px; border-left: 5px solid #00bcd4; align-items: center; }
        .menu-row-tv .item-name { font-size: 1.6rem; font-weight: bold; color: #fff; text-align: left; }
        .menu-row-tv .item-desc { font-size: 1.1rem; color: #aaa; text-align: left; margin-top: 5px; }
        .menu-row-tv .item-price { font-size: 1.8rem; font-weight: bold; color: #4caf50; }

        .brand-slide { background: linear-gradient(135deg, #1b263b, #0d1b2a); border-radius: 12px; padding: 30px; border: 2px solid #ff9800; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .brand-slide h2 { font-size: 3rem; color: #ff9800; margin-bottom: 10px; }
        .brand-slide p.subtitle { font-size: 1.4rem; color: #00bcd4; margin-bottom: 20px; text-transform: uppercase; }
        .brand-slide .phone-badge { background: #25d366; color: #fff; font-size: 2rem; font-weight: bold; padding: 12px 25px; border-radius: 50px; display: inline-flex; align-items: center; gap: 10px; margin-top: 15px; }

        .service-card-tv h2 { font-size: 2.5rem; color: #00bcd4; margin-bottom: 20px; }
        .service-card-tv p { font-size: 1.6rem; color: #ddd; line-height: 1.5; }
        .service-card-tv .icon { font-size: 5rem; margin-bottom: 20px; }

        .empty-msg { font-size: 1.8rem; color: #666; text-align: center; grid-column: span 2; margin-top: 50px; }
    </style>
</head>
<body>

    <!-- BARRA DE ALTERNÂNCIA DE MODO -->
    <div id="mode-selector">
        <span>Painel de Controle:</span>
        <button class="btn-admin" onclick="switchMode('admin')">🖥️ Cozinha / Pedidos</button>
        <button class="btn-menu" onclick="switchMode('menu')">📋 Editar Cardápio</button>
        <button class="btn-tv" onclick="openTvNewTab()">📺 Abrir Tela da TV (Nova Página)</button>
    </div>

    <!-- TELA 1: COZINHA / CAIXA -->
    <div id="admin-screen" class="screen">
        <div style="display: flex; gap: 20px; width: 100%; height: 100%;">
            <div class="admin-column">
                <h2>1. Novo Pedido</h2>
                <div class="form-group">
                    <input type="text" id="clientName" placeholder="Nome do Cliente (ex: Carlos)" autofocus onkeypress="handleKeyPress(event)">
                    <button onclick="addOrder()">Adicionar</button>
                </div>
                <h2>Em Preparo</h2>
                <div id="preparingList" class="order-list-admin"></div>
            </div>

            <div class="admin-column">
                <h2>Prontos para Retirada</h2>
                <div id="readyList" class="order-list-admin"></div>
            </div>

            <div class="admin-column">
                <h2>Histórico Recente (Entregues)</h2>
                <div id="historyList" class="order-list-admin"></div>
            </div>
        </div>
    </div>

    <!-- TELA 2: GERENCIAMENTO DE CARDÁPIO -->
    <div id="menu-screen" class="screen">
        <h2 id="menuFormTitle">Adicionar Item ao Cardápio (Exibidos na TV)</h2>
        <div class="menu-form">
            <input type="hidden" id="editMenuId" value="">
            <input type="text" id="menuName" placeholder="Nome do Prato / Lanche (ex: X-Tudo)">
            <input type="text" id="menuDesc" placeholder="Descrição curta (ex: Pão, hambúrguer, queijo)">
            <input type="text" id="menuPrice" placeholder="Preço (ex: R$ 22,00)">
            <button id="btnSaveMenu" onclick="saveMenuItem()">Adicionar Item</button>
            <button id="btnCancelEdit" class="btn-cancel-edit" onclick="resetMenuForm()">Cancelar</button>
        </div>
        <div id="menuItemsList" class="menu-items-list"></div>
    </div>

    <!-- TELA 3: A TV DO ESTABELECIMENTO -->
    <div id="tv-screen" class="screen">
        <div class="tv-left">
            <h1>Retire seu Pedido</h1>
            <div id="tvReadyGrid" class="grid-prontos">
                <div class="empty-msg">Nenhum pedido pronto no momento.</div>
            </div>
        </div>
        <div class="tv-right" id="tvCarouselContainer"></div>
    </div>

    <script>
        let cachedOrdersJSON = "";
        let cachedMenuJSON = "";

        function loadData() {
            let orders = JSON.parse(localStorage.getItem('simple_orders')) || [];
            let menuItems = JSON.parse(localStorage.getItem('simple_menu')) || [
                { id: 1, name: "X-Burger Simples", desc: "Pão, carne artesanal e queijo", price: "R$ 15,00" },
                { id: 2, name: "Prato Feito do Dia", desc: "Arroz, feijão, fritas e carne", price: "R$ 20,00" },
                { id: 3, name: "Refrigerante Lata", desc: "Coca-Cola, Guaraná ou Sprite", price: "R$ 6,00" }
            ];
            return { orders, menuItems };
        }

        function saveData(orders, menuItems) {
            localStorage.setItem('simple_orders', JSON.stringify(orders));
            localStorage.setItem('simple_menu', JSON.stringify(menuItems));
        }

        function openTvNewTab() {
            const cleanUrl = window.location.href.split('?')[0];
            window.open(cleanUrl + '?mode=tv', '_blank');
        }

        function switchMode(mode) {
            document.getElementById('admin-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('tv-screen').classList.remove('active');
            
            const modeSelector = document.getElementById('mode-selector');

            if (mode === 'admin') {
                document.getElementById('admin-screen').classList.add('active');
                modeSelector.style.display = 'flex';
            } else if (mode === 'menu') {
                document.getElementById('menu-screen').classList.add('active');
                modeSelector.style.display = 'flex';
                renderMenuAdmin();
            } else {
                document.getElementById('tv-screen').classList.add('active');
                modeSelector.style.display = 'none';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') addOrder();
        }

        function addOrder() {
            const input = document.getElementById('clientName');
            const name = input.value.trim();
            if (!name) return;

            let { orders, menuItems } = loadData();
            orders.push({ id: Date.now(), name: name.toUpperCase(), status: 'preparing' });
            saveData(orders, menuItems);
            
            input.value = '';
            input.focus();
            renderAll(true);
        }

        function markReady(id) {
            let { orders, menuItems } = loadData();
            let targetName = "";

            orders = orders.map(o => {
                if (o.id === id) {
                    targetName = o.name.replace(/ - /g, ' '); 
                    return { ...o, status: 'ready' };
                }
                return o;
            });

            saveData(orders, menuItems);
            renderAll(true);
            if (targetName) speakOrderReady(targetName);
        }

        function finishOrder(id) {
            let { orders, menuItems } = loadData();
            orders = orders.map(o => o.id === id ? { ...o, status: 'history' } : o);
            saveData(orders, menuItems);
            renderAll(true);
        }

        function removeOrder(id) {
            let { orders, menuItems } = loadData();
            orders = orders.filter(o => o.id !== id);
            saveData(orders, menuItems);
            renderAll(true);
        }

        function saveMenuItem() {
            let { orders, menuItems } = loadData();
            const editId = document.getElementById('editMenuId').value;
            const name = document.getElementById('menuName').value.trim();
            const desc = document.getElementById('menuDesc').value.trim();
            const price = document.getElementById('menuPrice').value.trim();

            if (!name || !price) {
                alert('Preencha pelo menos o nome e o preço!');
                return;
            }

            if (editId) {
                menuItems = menuItems.map(item => item.id == editId ? { ...item, name, desc, price } : item);
            } else {
                menuItems.push({ id: Date.now(), name, desc, price });
            }

            saveData(orders, menuItems);
            resetMenuForm();
            renderMenuAdmin();
            buildCarouselSlides(true);
        }

        function editMenuItem(id) {
            let { menuItems } = loadData();
            const item = menuItems.find(i => i.id == id);
            if (!item) return;

            document.getElementById('editMenuId').value = item.id;
            document.getElementById('menuName').value = item.name;
            document.getElementById('menuDesc').value = item.desc;
            document.getElementById('menuPrice').value = item.price;

            document.getElementById('menuFormTitle').innerText = "Editando Item ✏️";
            document.getElementById('btnSaveMenu').innerText = "Salvar Alterações";
            document.getElementById('btnCancelEdit').style.display = "inline-block";
        }

        function resetMenuForm() {
            document.getElementById('editMenuId').value = '';
            document.getElementById('menuName').value = '';
            document.getElementById('menuDesc').value = '';
            document.getElementById('menuPrice').value = '';
            document.getElementById('menuFormTitle').innerText = "Adicionar Item ao Cardápio (Exibidos na TV)";
            document.getElementById('btnSaveMenu').innerText = "Adicionar Item";
            document.getElementById('btnCancelEdit').style.display = "none";
        }

        function removeMenuItem(id) {
            let { orders, menuItems } = loadData();
            menuItems = menuItems.filter(item => item.id !== id);
            saveData(orders, menuItems);
            renderMenuAdmin();
            buildCarouselSlides(true);
        }

        function renderMenuAdmin() {
            let { menuItems } = loadData();
            const list = document.getElementById('menuItemsList');
            list.innerHTML = '';
            if (menuItems.length === 0) {
                list.innerHTML = `<p style="color: #777;">Nenhum item cadastrado.</p>`;
                return;
            }
            menuItems.forEach(item => {
                list.innerHTML += `
                    <div class="menu-item-card">
                        <div>
                            <strong style="color: #00bcd4;">${item.name}</strong>
                            <p style="color: #aaa; font-size: 0.9rem; margin-top: 4px;">${item.desc}</p>
                            <span style="display: block; margin-top: 8px; color: #4caf50; font-weight: bold;">${item.price}</span>
                        </div>
                        <div class="menu-item-actions">
                            <button class="btn-edit" onclick="editMenuItem(${item.id})">Editar</button>
                            <button class="btn-delete" onclick="removeMenuItem(${item.id})">Excluir</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderAll(force = false) {
            let { orders, menuItems } = loadData();
            
            let ordersJSON = JSON.stringify(orders);
            let menuJSON = JSON.stringify(menuItems);
            if (!force && ordersJSON === cachedOrdersJSON && menuJSON === cachedMenuJSON) return;
            
            cachedOrdersJSON = ordersJSON;
            cachedMenuJSON = menuJSON;

            const preparingList = document.getElementById('preparingList');
            const readyList = document.getElementById('readyList');
            const historyList = document.getElementById('historyList');
            
            if (preparingList) preparingList.innerHTML = '';
            if (readyList) readyList.innerHTML = '';
            if (historyList) historyList.innerHTML = '';

            const preparing = orders.filter(o => o.status === 'preparing');
            const ready = orders.filter(o => o.status === 'ready');
            const history = orders.filter(o => o.status === 'history').slice(-5);

            if (preparingList) {
                preparing.forEach(o => {
                    preparingList.innerHTML += `
                        <div class="order-card-admin">
                            <span><strong>${o.name}</strong></span>
                            <button onclick="markReady(${o.id})">Pronto ➡</button>
                        </div>
                    `;
                });
            }

            if (readyList) {
                ready.forEach(o => {
                    readyList.innerHTML += `
                        <div class="order-card-admin ready">
                            <span><strong>${o.name}</strong></span>
                            <button onclick="finishOrder(${o.id})">Entregue ✓</button>
                        </div>
                    `;
                });
            }

            if (historyList) {
                history.forEach(o => {
                    historyList.innerHTML += `
                        <div class="order-card-admin history">
                            <span>${o.name}</span>
                            <button class="cancel" onclick="removeOrder(${o.id})">✕</button>
                        </div>
                    `;
                });
            }

            const tvReadyGrid = document.getElementById('tvReadyGrid');
            if (tvReadyGrid) {
                if (ready.length === 0) {
                    tvReadyGrid.innerHTML = `<div class="empty-msg">Aguardando novos pedidos...</div>`;
                } else {
                    let currentTvHTML = "";
                    ready.forEach(o => {
                        let nomeFormatadoTv = o.name.replace(/ - /g, '<br>');

                        currentTvHTML += `
                            <div class="card-pronto">
                                <div class="nome">${nomeFormatadoTv}</div>
                                <div class="status-txt">Pode Retirar!</div>
                            </div>
                        `;
                    });
                    if (tvReadyGrid.innerHTML !== currentTvHTML) {
                        tvReadyGrid.innerHTML = currentTvHTML;
                    }
                }
            }

            buildCarouselSlides();
        }

        let currentSlide = 0;
        let slideInterval = null;

        function buildCarouselSlides(forceRebuild = false) {
            let { menuItems } = loadData();
            const container = document.getElementById('tvCarouselContainer');
            if (!container) return;

            if (!forceRebuild && container.children.length > 0) return;

            let slidesHTML = `
                <div class="carousel-slide">
                    <div class="brand-slide">
                        <div style="font-size: 5rem; margin-bottom: 10px;">👩‍🍳</div>
                        <h2>Lanches da Linda</h2>
                        <p class="subtitle">Almoço, Janta, Lanches e Sucos Naturais</p>
                        <div class="phone-badge"><span>🟢</span> (13) 9999-9999</div>
                    </div>
                </div>
            `;

            if (menuItems.length > 0) {
                let chunks = [];
                for (let i = 0; i < menuItems.length; i += 4) {
                    chunks.push(menuItems.slice(i, i + 4));
                }

                chunks.forEach((chunk) => {
                    slidesHTML += `
                        <div class="carousel-slide">
                            <div class="menu-display-title">Cardápio do Dia 🍽️</div>
                            <div class="menu-grid-tv">
                    `;
                    chunk.forEach(item => {
                        slidesHTML += `
                            <div class="menu-row-tv">
                                <div>
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-desc">${item.desc}</div>
                                </div>
                                <div class="item-price">${item.price}</div>
                            </div>
                        `;
                    });
                    slidesHTML += `</div></div>`;
                });
            }

            slidesHTML += `
                <div class="carousel-slide service-card-tv">
                    <div class="icon">🖨️</div>
                    <h2>Serviços de Impressão</h2>
                    <p>Imprima seus trabalhos, boletos e documentos direto aqui no local!</p>
                </div>
                <div class="carousel-slide service-card-tv">
                    <div class="icon">📄</div>
                    <h2>Xérox & Cópias</h2>
                    <p>Preços acessíveis e rapidez para cópias preto e branco ou coloridas.</p>
                </div>
                <div class="carousel-slide service-card-tv">
                    <div class="icon">📱</div>
                    <h2>Envie por WhatsApp</h2>
                    <p>Mande seu arquivo pelo celular e retire impresso na hora!</p>
                </div>
                <div class="carousel-slide service-card-tv">
                    <h2>Pague com Pix</h2>
                    <p style="font-size: 1.2rem; margin-bottom: 15px;">Aponte a câmera e digite o valor:</p>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=00020126580014BR.GOV.BCB.PIX01365108c4d8-6a0b-4265-80e4-b48354e179235204000053039865802BR5925Diego%20Farias%20Pio%20da%20Silva6009SAO%20PAULO62140510rpsaAZYJc26304E6A2" alt="QR Code Pix" style="width: 220px; height: 220px; border-radius: 10px; background: #fff; padding: 10px; border: 4px solid #00bcd4;">
                </div>
            `;

            container.innerHTML = slidesHTML;
            const slides = document.querySelectorAll('.carousel-slide');
            if (slides.length > 0) {
                if (currentSlide >= slides.length) currentSlide = 0;
                slides.forEach(s => s.classList.remove('active-slide'));
                slides[currentSlide].classList.add('active-slide');
            }
        }
        function initCarouselTimer() {
            if (slideInterval) clearInterval(slideInterval);
            slideInterval = setInterval(() => {
                const slides = document.querySelectorAll('.carousel-slide');
                if (slides.length === 0) return;
                slides[currentSlide].classList.remove('active-slide');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active-slide');
            }, 8000);
        }

        let speechQueue = [];
        let isSpeaking = false;

        function speakOrderReady(clientName) {
            speechQueue.push(clientName);
            processSpeechQueue();
        }

        function processSpeechQueue() {
            if (isSpeaking || speechQueue.length === 0) return;
            isSpeaking = true;
            const clientName = speechQueue.shift();

            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const textToSpeak = `Pedido pronto, ${clientName}!`;
                    const repeticoes = 3; 
                    const intervaloMs = 2500; 
                    
                    const voices = window.speechSynthesis.getVoices();
                    const ptVoice = voices.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt'));
                    let repeticaoAtual = 0;

                    function falarProximaRepeticao() {
                        if (repeticaoAtual < repeticoes) {
                            const utterance = new SpeechSynthesisUtterance(textToSpeak);
                            utterance.lang = 'pt-BR';
                            utterance.rate = 1.0;
                            utterance.pitch = 1.05;
                            if (ptVoice) utterance.voice = ptVoice;

                            utterance.onend = function() {
                                repeticaoAtual++;
                                if (repeticaoAtual < repeticoes) {
                                    setTimeout(falarProximaRepeticao, intervaloMs - 1000);
                                } else {
                                    isSpeaking = false;
                                    setTimeout(processSpeechQueue, 500);
                                }
                            };
                            utterance.onerror = function() {
                                isSpeaking = false;
                                setTimeout(processSpeechQueue, 500);
                            };
                            window.speechSynthesis.speak(utterance);
                        }
                    }
                    falarProximaRepeticao();
                } else {
                    isSpeaking = false;
                }
            } catch (e) {
                isSpeaking = false;
                setTimeout(processSpeechQueue, 500);
            }
        }

        setInterval(() => {
            renderAll(false);
        }, 1000);

        renderAll(true);
        initCarouselTimer();

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'tv') {
            switchMode('tv');
        } else {
            switchMode('admin');
        }
    </script>
</body>
</html>
